[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasswing"
description = "Bypass Flutter's BoringSSL certificate pinning for authorized penetration testing (Frida runtime hooks + static libflutter.so patching, Android)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "glasswing contributors" }]
keywords = [
  "flutter",
  "ssl-pinning",
  "bypass",
  "frida",
  "android",
  "pentest",
  "boringssl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dynamic = ["version"]
dependencies = [
  "frida>=17.0,<18",
  "frida-tools>=13.0",   # official CLI + ships the Java/ObjC/Swift bridge sources
  "typer>=0.9",
  "rich>=13.0.0",
  "PyYAML>=6.0",
  "pyelftools>=0.29",
  "capstone>=5.0",
  "lief>=0.13",
  "androguard>=3.3.5",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/hasharmujahid/glasswing"
Issues = "https://github.com/hasharmujahid/glasswing/issues"

[project.scripts]
glasswing = "glasswing.cli:app"
# backward-compatible alias (pre-rebrand name)
flutterpinning = "glasswing.cli:app"

[tool.setuptools.packages.find]
include = ["glasswing*"]

[tool.setuptools.package-data]
glasswing = ["db/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "glasswing.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
  # keep Optional[X] in typer signatures: typer evaluates annotations at
  # runtime, and PEP 604 unions break on Python 3.9
  "UP007",
  "UP045",
  # typer's Option/Argument calls in parameter defaults are the framework idiom
  "B008",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
