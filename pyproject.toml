[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasswing"
version = "0.2.0"
description = "Bypass Flutter's BoringSSL certificate pinning for authorized penetration testing (Frida runtime hooks + static libflutter.so patching, Android)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "glasswing contributors" }]
keywords = [
  "flutter",
  "ssl-pinning",
  "bypass",
  "frida",
  "android",
  "pentest",
  "boringssl",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "frida>=16.0.0",
  "typer>=0.9",
  "rich>=13.0.0",
  "PyYAML>=6.0",
  "pyelftools>=0.29",
  "capstone>=5.0",
  "lief>=0.13",
  "androguard>=3.3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
glasswing = "glasswing.cli:app"
# backward-compatible alias (pre-rebrand name)
flutterpinning = "glasswing.cli:app"

[tool.setuptools.packages.find]
include = ["glasswing*"]

[tool.setuptools.package-data]
glasswing = ["db/*.yaml"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
